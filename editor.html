<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Editor Profile — RSS Watch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<header class="navbar" id="app-navbar"></header>
<div class="page-wrapper">
 <div class="container">

  <div class="empty-state" id="loading-state"><div class="loading-spinner"></div><p>Loading…</p></div>
  <div class="empty-state" id="error-state" style="display:none">
    <svg width="48" height="48" viewBox="0 0 48 48" fill="none"><path d="M24 4L44 40H4L24 4Z" stroke="#cbd5e1" stroke-width="3" stroke-linejoin="round"/><path d="M24 18V26M24 32V32.5" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/></svg>
    <p id="error-text">Editor not found.</p>
    <a href="index.html" id="error-back-link" class="back-link" style="margin-top:8px">Return to Overview</a>
  </div>

  <div id="profile-content" style="display:none">
    <a href="#" id="profile-back-link" class="back-link">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 12L6 8L10 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="profile-back-label">Return to Report</span>
    </a>

    <!-- PROFILE CARDS ROW -->
    <div class="profile-cards-row">
      <div class="info-card">
        <div class="info-avatar" id="info-avatar"></div>
        <div class="info-details">
          <h1 id="editor-name">—</h1>
          <div class="info-pills" id="info-pills"></div>
          <div class="info-items" id="info-items"></div>
        </div>
      </div>
      <div class="stats-card">
        <h3>Profile Statistics</h3>
        <div class="stat-grid" id="profile-stats"></div>
        <a id="report-link" href="#" class="report-link-btn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M5 7H11M5 10H9M13 13H3C2.45 13 2 12.55 2 12V4C2 3.45 2.45 3 3 3H8.59C8.85 3 9.1 3.1 9.29 3.29L13.71 7.71C13.9 7.9 14 8.41V12C14 12.55 13.55 13 13 13Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          View Full Article Report
        </a>
      </div>
    </div>

    <!-- PHOBIA ANALYSIS BREAKDOWN -->
    <section class="section" id="breakdown-section" style="display:none">
      <div class="section-header">
        <div class="section-header__title-group">
          <h2 class="section-title">Phobia Analysis Breakdown</h2>
          <p class="section-subtitle" id="breakdown-count2"></p>
        </div>
        <span class="item-count" id="breakdown-count">0 Categories</span>
      </div>
      <div id="breakdown-grid" class="breakdown-grid"></div>
    </section>

    <!-- EVIDENCE -->
    <section class="section" id="evidence-section" style="display:none">
      <div class="section-header">
        <div class="section-header__title-group">
          <h2 class="section-title">Evidence</h2>
          <p class="section-subtitle">Flagged content found in this Wikipedia article</p>
        </div>
      </div>
      <div class="ev-report-card">
        <div class="ev-report-header">
          <div class="ev-report-icon">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><path d="M9 12H19M9 16H15M22 23H6C4.895 23 4 22.105 4 21V7C4 5.895 4.895 5 6 5H15.17C15.7 5 16.21 5.21 16.59 5.59L22.41 11.41C22.79 11.79 23 12.3 23 12.83V21C23 22.105 22.105 23 22 23Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </div>
          <div class="ev-report-main">
            <h4 class="ev-report-title" id="ev-report-title">—</h4>
            <div class="ev-report-meta">
              <span class="score-tag" id="ev-report-score">—</span>
              <span class="divider">·</span>
              <span class="offense-tag" id="ev-report-hits">—</span>
            </div>
          </div>
          <a href="#" id="ev-report-view" class="view-btn">
            View
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 11L9 7L5 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
        </div>
        <div class="ev-phobic-highlights">
          <h5>Phobic Highlights</h5>
          <div id="ev-report-cats" class="ev-cats-row"></div>
        </div>
      </div>
    </section>

  </div>
 </div>
</div>
<footer class="footer" id="app-footer"></footer>
<script src="js/common.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
